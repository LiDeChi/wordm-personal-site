<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">ARC3 Cockpit cover</title>
  <desc id="desc">A paper-like ARC grid cockpit cover for the ARC3 product card.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#e8d7bd"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#26313b"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5d4229" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#eadcca"/>
  <path d="M0 0h960v560H0z" fill="url(#paper)"/>
  <g opacity=".34">
    <path d="M0 92h960M0 184h960M0 276h960M0 368h960M0 460h960" stroke="#8a6a48" stroke-opacity=".18"/>
    <path d="M120 0v560M240 0v560M360 0v560M480 0v560M600 0v560M720 0v560M840 0v560" stroke="#8a6a48" stroke-opacity=".12"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="118" y="82" width="724" height="396" rx="34" fill="url(#panel)"/>
    <rect x="142" y="108" width="676" height="344" rx="22" fill="#f7eddc"/>
    <g transform="translate(192 142)">
      <rect width="260" height="260" rx="20" fill="#1d252d"/>
      <g transform="translate(26 26)">
        <rect width="44" height="44" rx="8" fill="#f0d885"/>
        <rect x="54" width="44" height="44" rx="8" fill="#dce3c0"/>
        <rect x="108" width="44" height="44" rx="8" fill="#c8d8df"/>
        <rect x="162" width="44" height="44" rx="8" fill="#e7a091"/>
        <rect y="54" width="44" height="44" rx="8" fill="#d7c0df"/>
        <rect x="54" y="54" width="44" height="44" rx="8" fill="#f7eddc"/>
        <rect x="108" y="54" width="44" height="44" rx="8" fill="#e6aa78"/>
        <rect x="162" y="54" width="44" height="44" rx="8" fill="#dce3c0"/>
        <rect y="108" width="44" height="44" rx="8" fill="#c8d8df"/>
        <rect x="54" y="108" width="44" height="44" rx="8" fill="#e7a091"/>
        <rect x="108" y="108" width="44" height="44" rx="8" fill="#f0d885"/>
        <rect x="162" y="108" width="44" height="44" rx="8" fill="#f7eddc"/>
        <rect y="162" width="44" height="44" rx="8" fill="#e6aa78"/>
        <rect x="54" y="162" width="44" height="44" rx="8" fill="#d7c0df"/>
        <rect x="108" y="162" width="44" height="44" rx="8" fill="#dce3c0"/>
        <rect x="162" y="162" width="44" height="44" rx="8" fill="#c8d8df"/>
      </g>
    </g>
    <g transform="translate(512 160)" fill="#2b2118">
      <text x="0" y="0" font-family="Georgia, serif" font-size="58" font-weight="700">ARC3</text>
      <text x="0" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">WORLD MODEL COCKPIT</text>
      <rect x="0" y="88" width="226" height="48" rx="12" fill="#f0d885" stroke="#8a6a48" stroke-opacity=".28"/>
      <text x="18" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">RESET / ACTIONS</text>
      <path d="M0 174h230" stroke="#8a6a48" stroke-opacity=".25" stroke-width="2"/>
      <circle cx="16" cy="216" r="10" fill="#dce3c0"/>
      <text x="38" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">imagine rollout</text>
      <circle cx="16" cy="260" r="10" fill="#c8d8df"/>
      <text x="38" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">plan next move</text>
    </g>
